[project]
name = "opticstream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=3.3.0",
    "linc-convert @ git+https://github.com/lincbrain/linc-convert.git@dc8f3243df01d09493a13e53305adede08784695",
    "nifti-zarr @ git+https://github.com/calvinchai/nifti-zarr-py.git@12336420beaa023cbdd9d9e5c24e3c115687fe9a",
    "psoct-toolbox @ git+https://github.com/calvinchai/psoct-toolbox.git@5182337044d2b7f8337ca205a33c9da3ddd69bda",
    "matplotlib>=3.10.8",
    "prefect[shell,slack,sqlalchemy,redis]==3.6.20",
    "watchdog>=4",
    "psutil>=6",
    "pystray>=0.19",
    "slack-sdk",
    "pydantic",
    "platformdirs>=4.0",
    "grpcio>=1.60.0",
    "redis>=5.0.0",
    "streamlit>=1.40.0",
    "streamlit-autorefresh>=1.0.1",
    "jinja2",
    "PyYAML",
    "dask",
    "nibabel",
    "numpy",
    "psycopg2-binary",
    "streamlit-extras>=1.5.0",
    "requests>=2.32.0",
    "packaging>=24.0",
    "rq>=2.8.0",
    "protobuf>=5.26.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "ruff",
    "grpcio-tools>=1.60.0",
    "pyinstaller>=6.0",
]

[project.scripts]
opticstream = "opticstream.cli:main"
ops = "opticstream.cli:main"
opticnode = "opticnode.main:main"

#linc-convert = { path = "/space/megaera/1/users/kchai/linc-convert", editable = true }
#nifti-zarr = { path = "/space/megaera/1/users/kchai/nifti-zarr", editable = true }
#psoct-toolbox = { path = "/space/megaera/1/users/kchai/code/psoct-toolbox", editable = true }

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opticstream*", "opticnode*", "optichub*", "opticapi*"]
exclude = ["notebooks*"]

[tool.ruff]
extend-exclude = ["opticapi/generated"]

[tool.pytest.ini_options]
markers = [
  "integration: integration tests",
]
